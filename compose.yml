services:
    pgsql:
        image: postgres:17-alpine
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:?Set DB_DATABASE in .env}'
            POSTGRES_USER: '${DB_USERNAME:?Set DB_USERNAME in .env}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 10

    rustfs:
        image: rustfs/rustfs:latest
        ports:
            - '127.0.0.1:${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '127.0.0.1:${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_ACCESS_KEY: '${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}'
            RUSTFS_SECRET_KEY: '${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}'
            RUSTFS_OBS_LOG_DIRECTORY: /logs
        volumes:
            - 'sail-rustfs:/data'
            - 'sail-rustfs-logs:/logs'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
    sail-rustfs:
    sail-rustfs-logs:
    